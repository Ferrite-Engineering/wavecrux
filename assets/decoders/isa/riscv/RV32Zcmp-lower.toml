# ── push / pop (quadrant 2, funct3 101) ───────────────────────────────────────

[cm_push]
type = "t_cm_push"

[cm_push.repr]
default = "$name$ %push_list%"

[cm_push.instructions."cm.push"]
mask = 0xff03
match = 0xb802

[cm_pop]
type = "t_cm_pop"

[cm_pop.repr]
default = "$name$ %pop_list%"

[cm_pop.instructions."cm.pop"]
mask = 0xff03
match = 0xba02
[cm_pop.instructions."cm.popretz"]
mask = 0xff03
match = 0xbc02
[cm_pop.instructions."cm.popret"]
mask = 0xff03
match = 0xbe02

# ── register-pair moves ───────────────────────────────────────────────────────

[cm_mv]
type = "t_cm_mv"

[cm_mv.repr]
default = "$name$ %r1s%, %r2s%"

[cm_mv.instructions."cm.mvsa01"]
mask = 0xfc63
match = 0xac22
[cm_mv.instructions."cm.mva01s"]
mask = 0xfc63
match = 0xac62
