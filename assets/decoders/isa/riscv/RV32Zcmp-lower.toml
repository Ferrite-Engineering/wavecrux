# RV32Zcmp — compressed push / pop and register-pair moves, "lower" variant.
#
# The 16-bit encodings sit in the low half of a 32-bit instruction word; the
# high half is don't-care filler, as in RV32C-lower.toml. Schema follows the
# JKU `instruction-decoder` Rust crate (see NOTICE.md).
#
# `cm.push` / `cm.pop` / `cm.popret` / `cm.popretz` carry a 4-bit register
# list (`rlist`, bits 7:4) and a 2-bit `spimm` (bits 3:2). The stack
# adjustment is not a field: it is a base that depends on how many registers
# the list holds, rounded up to 16 bytes, plus `spimm * 16`. The schema has
# no arithmetic, so the six bits are read as one part and named whole by a
# table: `{ra, s0}, -16`. The bases here are RV32's (four bytes a register);
# RV64 rounds eight-byte registers instead, which is why this file is RV32
# only. A reserved `rlist` (0-3) is not in the table and renders as its raw
# number.
#
# Zcmp reuses the encoding space of `c.fsdsp`, so a core cannot implement
# both; this corpus has no `c.fsdsp`.
set = "RV32Zcmp"
width = 32

[formats]
names = ["cm_push", "cm_pop", "cm_mv"]
parts = [
    ["push_list", 6, "Zcmp_push"],
    ["pop_list", 6, "Zcmp_pop"],
    ["r1s", 3, "Register_s"],
    ["r2s", 3, "Register_s"],
    ["none", 32, "u32"],
]

[types]
names = ["t_cm_push", "t_cm_pop", "t_cm_mv"]

# funct6[15:10] | funct2[9:8] | rlist[7:4] | spimm[3:2] | op[1:0]
[[types.t_cm_push]]
name = "none"
top = 31
bot = 16
[[types.t_cm_push]]
name = "none"
top = 15
bot = 8
[[types.t_cm_push]]
name = "push_list"
top = 5
bot = 0
[[types.t_cm_push]]
name = "none"
top = 1
bot = 0

[[types.t_cm_pop]]
name = "none"
top = 31
bot = 16
[[types.t_cm_pop]]
name = "none"
top = 15
bot = 8
[[types.t_cm_pop]]
name = "pop_list"
top = 5
bot = 0
[[types.t_cm_pop]]
name = "none"
top = 1
bot = 0

# funct6[15:10] | r1s'[9:7] | funct2[6:5] | r2s'[4:2] | op[1:0]
[[types.t_cm_mv]]
name = "none"
top = 31
bot = 16
[[types.t_cm_mv]]
name = "none"
top = 15
bot = 10
[[types.t_cm_mv]]
name = "r1s"
top = 2
bot = 0
[[types.t_cm_mv]]
name = "none"
top = 6
bot = 5
[[types.t_cm_mv]]
name = "r2s"
top = 2
bot = 0
[[types.t_cm_mv]]
name = "none"
top = 1
bot = 0

[mappings]
names = ["Register_s", "Zcmp_push", "Zcmp_pop"]
# The `sreg` encoding: 0 and 1 are s0 and s1 (x8, x9), 2-7 are s2-s7.
Register_s = ["s0", "s1", "s2", "s3", "s4", "s5", "s6", "s7"]

# Key: rlist * 4 + spimm.
