# RV32M — multiply/divide standard extension.
#
# All R-type, opcode 0x33, funct7 = 0x01. Composes with RV32I.toml in a
# multi-file bundle. Schema follows the JKU `instruction-decoder` Rust crate.
set = "RV32M"
width = 32

[formats]
names = ["rtype_m"]
parts = [
    ["rd", 5, "Register_int"],
    ["rs1", 5, "Register_int"],
    ["rs2", 5, "Register_int"],
    ["none", 32, "u32"],
]

[types]
names = ["t_r_m"]

[[types.t_r_m]]
name = "none"
top = 31
bot = 25
[[types.t_r_m]]
name = "rs2"
top = 4
bot = 0
[[types.t_r_m]]
name = "rs1"
top = 4
bot = 0
[[types.t_r_m]]
name = "none"
top = 14
bot = 12
[[types.t_r_m]]
name = "rd"
top = 4
bot = 0
[[types.t_r_m]]
name = "none"
top = 6
bot = 0

[mappings]
names = ["Register_int"]
Register_int = [
    "zero", "ra", "sp", "gp", "tp", "t0", "t1", "t2",
    "s0", "s1", "a0", "a1", "a2", "a3", "a4", "a5",
    "a6", "a7", "s2", "s3", "s4", "s5", "s6", "s7",
    "s8", "s9", "s10", "s11", "t3", "t4", "t5", "t6",
]

[rtype_m]
type = "t_r_m"

[rtype_m.repr]
default = "$name$ %rd%, %rs1%, %rs2%"

[rtype_m.instructions.mul]
mask = 0xfe00707f
match = 0x02000033
[rtype_m.instructions.mulh]
mask = 0xfe00707f
match = 0x02001033
[rtype_m.instructions.mulhsu]
mask = 0xfe00707f
match = 0x02002033
[rtype_m.instructions.mulhu]
mask = 0xfe00707f
match = 0x02003033
[rtype_m.instructions.div]
mask = 0xfe00707f
match = 0x02004033
[rtype_m.instructions.divu]
mask = 0xfe00707f
match = 0x02005033
[rtype_m.instructions.rem]
mask = 0xfe00707f
match = 0x02006033
[rtype_m.instructions.remu]
mask = 0xfe00707f
match = 0x02007033
