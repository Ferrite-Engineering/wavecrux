[package]
name = "wellen_wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bridge to the wellen waveform-parsing library for the WaveCrux Flutter Web build."
license = "Apache-2.0"
publish = false

[lib]
# cdylib emits a `.wasm` binary that wasm-bindgen post-processes; rlib so the
# crate's own #[cfg(test)] unit tests can also run as native Rust tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same wellen version as the desktop FFI crate so desktop and web parse
# identically. memmap2 falls out of the dep tree on wasm32 because nothing in
# our entry points calls a file-system reader, but rayon and the rest compile
# cleanly to wasm32-unknown-unknown.
wellen = "0.24"

wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Aggressive size optimization for the shipped wasm bundle. wasm-opt in
# wasm-pack 0.13.x lags behind the bulk-memory ops that modern rustc emits;
# we disable it via [package.metadata.wasm-pack.profile.release] and rely on
# LTO + opt-level=z + strip to hit the bundle budget.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

