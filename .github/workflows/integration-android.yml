name: Integration (Android emulator)

# ─── Trigger configuration ─────────────────────────────────────────────────────
# Runs integration tests on a real Android emulator — the only way to exercise
# the Android FFI runtime (.so loaded from the APK) and the platform-channel /
# defaultTargetPlatform-gated tests (share sheet, document picker, memory
# callbacks) that SKIP on desktop. Scoped to integration_test/mobile by default
# (most integration tests simulate device size on desktop already and run in the
# Linux nightly). Emulator CI is the flakiest/slowest tier → intended WEEKLY
# (schedule added after a manual verify). Manual-only for now.
on:
  workflow_dispatch:
    inputs:
      subdirs:
        description: 'Space-separated integration_test subdirs (default: mobile)'
        required: false
        default: 'mobile'
  schedule:
    # Weekly — Monday 05:00 UTC (= Sunday 11 PM Mountain; fixed UTC, no DST
    # tracking, matching the nightly convention). The emulator tier is the
    # slowest/flakiest, so it runs weekly rather than nightly.
    - cron: '20 7 * * 1'

concurrency:
  # Keyed by event as well as ref: a nightly must never be cancelled by a
  # push, and a push must never be cancelled by a nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded pushes are cancelled outright. `false` on main was the source
  # of a whole class of phantom failures: a run still QUEUED when a third
  # push arrives is cancelled by GitHub regardless, and a run whose jobs were
  # cancelled reports conclusion=failure — not cancelled. So main never did
  # verify every commit, it just misreported the ones it skipped. Cancelling
  # is honest, cheaper, and gates the thing that matters: the tip.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-emulator:
    name: Integration / Android emulator
    runs-on: ubuntu-latest
    # Fail fast instead of hanging until a runner shutdown if the emulator
    # stalls (the default job timeout is 6h).
    timeout-minutes: 90
    steps:
      # The runner starts with ~14 GB free on /. The emulator image + per-file
      # APK rebuilds (each `flutter test` runs assembleDebug) exhausted it
      # mid-run ("No space left on device"), which starved QEMU and dropped the
      # emulator — cascading every subsequent file to an instant device-not-
      # found failure. Reclaim ~20 GB of preinstalled tooling we don't use,
      # keeping the Android SDK and the hosted tool-cache (Java/Flutter) intact.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # `packages` overrides the action's default of `tools platform-tools`.
      # The legacy `tools` package is gone from Google's repository, so the
      # default makes sdkmanager exit 1 ("Failed to find package 'tools'")
      # before anything else runs. Nothing here uses it.
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install NDK (for Rust cross-compile)
        run: |
          sdkmanager "ndk;28.2.13676358"
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$LINKER" >> "$GITHUB_ENV"

      - name: Install Rust (stable) with x86_64 Android target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
        with:
          targets: x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wellen_ffi/target
          key: rust-android-emu-${{ hashFiles('native/wellen_ffi/Cargo.lock') }}
          restore-keys: rust-android-emu-

      # Open-core Gradle does not build Rust itself, so cross-compile the x86_64
      # ABI and stage the .so into jniLibs for the emulator's ABI.
      - name: Build + stage x86_64 .so into jniLibs
        run: |
          cargo build --release --target x86_64-linux-android --manifest-path native/wellen_ffi/Cargo.toml
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp native/wellen_ffi/target/x86_64-linux-android/release/libwellen_ffi.so \
             android/app/src/main/jniLibs/x86_64/libwellen_ffi.so

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      # Hardware acceleration for the x86_64 emulator on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Boots an x86_64 AVD and runs the suite inside it (one file per
      # invocation via the runner script). The Android FFI .so rides in the APK.
      # Lean options + software GPU + explicit cores/RAM avoid the QEMU "hanging
      # thread" stalls that starve the default config on the 2-core runner.
      #
      # GRADLE_OPTS disables the Gradle daemon: the open-core mobile suite is 10
      # files and each `flutter test` spawns assembleDebug, and android/
      # gradle.properties sets -Xmx8G. A persistent daemon holds (and grows)
      # that 8 GB heap across all 10 sequential builds; on the 16 GB runner that,
      # plus the 4 GB emulator, drives the kernel to OOM-kill QEMU near the end
      # of the run ("could not connect to TCP port 5554: Connection refused").
      # Without the daemon each build's JVM exits and releases its heap between
      # files, so the runner's memory stays flat and QEMU survives the marathon.
      # The retry below boots a fresh emulator to absorb any residual one-off
      # QEMU stall; if BOTH attempts fail the job still fails.
      - name: Run integration tests on emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: tool/run_integration_tests.sh -d emulator-5554 --no-clean ${{ github.event.inputs.subdirs || 'mobile' }}

      - name: Run integration tests on emulator (retry on a fresh emulator)
        if: steps.emu.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: tool/run_integration_tests.sh -d emulator-5554 --no-clean ${{ github.event.inputs.subdirs || 'mobile' }}
