name: Integration (iOS simulator)

# ─── Trigger configuration ─────────────────────────────────────────────────────
# Runs integration tests on an iOS simulator — the only way to exercise the iOS
# FFI runtime (libwellen_ffi linked via the WellenFFI.xcframework Swift package,
# loaded with DynamicLibrary.process()) and the platform-channel /
# defaultTargetPlatform-gated tests that SKIP on desktop. Same scoping as the
# Android emulator job: desktop-binding device-class-simulation tests carry
# skipOnMobileDevice and are skipped here; phone-class tests run. macOS runners
# are billed at a premium and the simulator tier is slow, so this is intended
# BI-WEEKLY (schedule added after a manual verify). Manual-only for now.
on:
  workflow_dispatch:
    inputs:
      subdirs:
        description: 'Space-separated integration_test subdirs (default: mobile)'
        required: false
        default: 'mobile'
  schedule:
    # Bi-weekly — 1st & 15th at 05:00 UTC (= 11 PM Mountain; fixed UTC, no DST
    # tracking). macOS runners are billed at a premium, so iOS runs ~2x/month
    # rather than weekly like Android.
    - cron: '0 8 1 * *'

concurrency:
  # Keyed by event as well as ref: a nightly must never be cancelled by a
  # push, and a push must never be cancelled by a nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded pushes are cancelled outright. `false` on main was the source
  # of a whole class of phantom failures: a run still QUEUED when a third
  # push arrives is cancelled by GitHub regardless, and a run whose jobs were
  # cancelled reports conclusion=failure — not cancelled. So main never did
  # verify every commit, it just misreported the ones it skipped. Cancelling
  # is honest, cheaper, and gates the thing that matters: the tip.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Integration / iOS simulator
    runs-on: macos-latest
    # Fail fast instead of hanging until the 6h default if a sim boot or test
    # stalls.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      # Both iOS slices are needed to assemble the XCFramework the Swift package
      # references; the simulator run links the -sim slice.
      - name: Install Rust (stable) with iOS targets
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wellen_ffi/target
          key: rust-integ-ios-${{ hashFiles('native/wellen_ffi/Cargo.lock') }}
          restore-keys: rust-integ-ios-

      - name: Build iOS device static lib (aarch64-apple-ios)
        working-directory: native/wellen_ffi
        run: cargo build --release --target aarch64-apple-ios

      - name: Build iOS simulator static lib (aarch64-apple-ios-sim)
        working-directory: native/wellen_ffi
        run: cargo build --release --target aarch64-apple-ios-sim

      # Package both slices into WellenFFI.xcframework (mirrors
      # scripts/build_ios.sh). The iOS Runner links it via SPM
      # (XCLocalSwiftPackageReference → .binaryTarget), no CocoaPods.
      - name: Assemble WellenFFI.xcframework
        working-directory: native/wellen_ffi
        run: |
          rm -rf WellenFFI.xcframework
          mkdir -p include
          cp wellen_ffi.h include/
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libwellen_ffi.a \
            -headers include \
            -library target/aarch64-apple-ios-sim/release/libwellen_ffi.a \
            -headers include \
            -output WellenFFI.xcframework

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.flutter.outputs.pub-cache-path }}
            .dart_tool/
          key: pub-integ-ios-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-integ-ios-

      # The restored `.dart_tool/` carries build_runner's asset graph, which a
      # `!` exclusion on the cache path cannot prevent. A graph written before
      # a source file was deleted — a crux-shared package's file after a pin
      # bump — fails codegen with `InvalidOutputException … Tried to delete
      # from package not in the build`, measured on the Pro overlay when
      # `lib/services/spawn/spawn_guards.dart` was removed here. Dropping the
      # graph is what actually keeps it out; a cold codegen costs ~13s.
      - name: Drop the restored build_runner asset graph
        shell: bash
        run: rm -rf .dart_tool/build

      - name: Install dependencies
        run: flutter pub get

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      # Boot the first available iPhone simulator and expose its UDID. The
      # macos-latest image ships pre-created iPhone simulators; pick one rather
      # than pinning a model/runtime that drifts with the image.
      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import sys, json; devs = json.load(sys.stdin)['devices']; cands = [d for rt in devs.values() for d in rt if 'iPhone' in d['name']]; print(cands[0]['udid'] if cands else '')")
          if [ -z "$UDID" ]; then
            echo 'No iPhone simulator available on this runner:'
            xcrun simctl list devices
            exit 1
          fi
          echo "Booting iPhone simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # Runs each integration_test file via `flutter test -d <udid>` (one at a
      # time). The Rust FFI is linked into the simulator app. --no-clean reuses
      # the sim build between files (the per-file clean is only needed for the
      # macOS desktop embedder's semantics teardown, which the sim doesn't hit).
      - name: Run integration tests on iOS simulator
        run: |
          chmod +x tool/run_integration_tests.sh
          tool/run_integration_tests.sh -d "$IOS_SIM_UDID" --no-clean ${{ github.event.inputs.subdirs || 'mobile' }}
