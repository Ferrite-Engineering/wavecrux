name: Rebaseline goldens (macOS golden host)

# ─── Why this exists ──────────────────────────────────────────────────────────
# The Stage golden baselines are macOS-authored, and "macOS" is not specific
# enough: on 2026-09-06 a set regenerated on a dev Mac still diffed the CI
# macOS runner by 0.86%–1.35% on the tachometer artboard, against a 0.5%
# tolerance. Rive's renderer is Skia-backed and curve-dense content amplifies
# any rasteriser difference, so the dev machine and the runner are genuinely
# different hosts.
#
# Raising the tolerance to cover that spread is NOT an option: on the phone
# artboard a needle at the wrong rpm moves only ~0.9% of pixels, so a
# tolerance wide enough to absorb 1.3% of host drift would mask the exact
# regression these goldens exist to catch.
#
# So the golden host is defined as THE CI MACOS RUNNER, and this workflow is
# how you rebaseline on it. Run it, download the artifact, commit the PNGs.
# Never regenerate Stage goldens on a dev machine and commit those.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'integration_test path to rebaseline'
        required: false
        default: 'integration_test/stage/tachometer_golden_test.dart'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebaseline:
    name: Rebaseline / macos-latest
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wellen_ffi/target
          key: rust-integ-macos-latest-${{ hashFiles('native/wellen_ffi/Cargo.lock') }}
          restore-keys: rust-integ-macos-latest-

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      # `flutter test -d macos` builds the app, which builds the native wellen
      # lib via cargo — the golden comparison is gated on that library being
      # present (stageProFixtureGoldensEnabled / _nativeWellenLibAvailable).
      - name: Regenerate goldens
        run: flutter test "${{ github.event.inputs.path }}" -d macos --update-goldens

      # Stage ONLY the files this run actually rewrote. A `**/goldens/**/*.png`
      # glob also sweeps up every unrelated committed golden — the first run
      # collected 5 unit-test PNGs the regeneration never touched, which is a
      # good way to commit something you did not mean to.
      - name: Stage what actually moved
        run: |
          git status --short
          mkdir -p /tmp/rebaselined
          changed=$(git diff --name-only -- '*.png')
          if [ -z "$changed" ]; then
            echo "No golden moved — the baselines already match this host."
            exit 0
          fi
          echo "$changed" | while read -r f; do
            mkdir -p "/tmp/rebaselined/$(dirname "$f")"
            cp "$f" "/tmp/rebaselined/$f"
          done
          echo "── staged ──"
          cd /tmp/rebaselined && find . -name '*.png' | sort

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rebaselined-goldens
          path: /tmp/rebaselined
          # Not `error`: a run that finds nothing to change is a valid result
          # (the baselines already match the host), not a failure.
          if-no-files-found: warn
          retention-days: 7
