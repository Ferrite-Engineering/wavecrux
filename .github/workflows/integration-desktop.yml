name: Integration (Desktop — macOS + Windows)

# ─── Trigger configuration ─────────────────────────────────────────────────────
# Closes the cross-OS gap: the nightly integration suite runs only on Linux, so
# this exercises the same end-to-end tests on macOS and Windows — where the
# native-FFI runtime load path and the file watcher (FSEvents vs
# ReadDirectoryChangesW) genuinely differ. macOS/Windows runners are pricey, so
# this is intended to run WEEKLY (schedule added after a manual verify), not
# nightly. Manual-only for now, with a 'subdirs' input for cheap validation.
on:
  workflow_dispatch:
    inputs:
      subdirs:
        description: 'Space-separated integration_test subdirs (empty = all)'
        required: false
        default: ''
  schedule:
    # Weekly — Thursday 05:00 UTC (distinct from Mon Android / Wed perf). macOS
    # is premium-billed, so desktop integration runs weekly, not nightly.
    - cron: '40 6 * * 4'

concurrency:
  # Keyed by event as well as ref: a nightly must never be cancelled by a
  # push, and a push must never be cancelled by a nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded pushes are cancelled outright. `false` on main was the source
  # of a whole class of phantom failures: a run still QUEUED when a third
  # push arrives is cancelled by GitHub regardless, and a run whose jobs were
  # cancelled reports conclusion=failure — not cancelled. So main never did
  # verify every commit, it just misreported the ones it skipped. Cancelling
  # is honest, cheaper, and gates the thing that matters: the tip.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Fortnight gate. This workflow and the Pro overlay's twin used to fire on the
  # same Thursday cron, so the suite paid for two macOS + two Windows desktop
  # runs a week. The Pro overlay consumes this repo as a submodule, so its run
  # already exercises this code — the second run only adds value for an
  # open-core-only regression.
  #
  # Rather than drop one, they alternate: open-core on EVEN ISO weeks, Pro on
  # ODD. Both signals survive, at half the price. The gate is its own tiny
  # Linux job because skipping has to happen before a macOS runner is claimed —
  # a premium runner that boots only to exit still bills.
  #
  # `date -u +%V` is the ISO-8601 week number; 10# forces base-10 so `08` and
  # `09` are not read as invalid octal.
  # ─────────────────────────────────────────────────────────────────────────────
  fortnight-gate:
    name: Fortnight gate (off weeks cancel the run; nothing is tested)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To cancel this run on an off week; see the step.
      actions: write
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — always runs."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 0 ]; then
            echo "ISO week $week is even — this is open-core's turn."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ISO week $week is odd — the Pro overlay covers this week."
          echo "run=false" >> "$GITHUB_OUTPUT"
          # A run that tests nothing must not conclude `success`. This one
          # used to: eight seconds, a green gate and a skipped integration job
          # with zero steps, indistinguishable in the run list from a real
          # 75-minute pass. Cancel it instead, so the list says `cancelled`;
          # and if the cancel does not land, fail rather than end green.
          echo "::notice::Off week: cancelling this run. Nothing is tested this week in this repository."
          gh run cancel "${{ github.run_id }}" -R "${{ github.repository }}"
          sleep 120
          echo "::error::the run was not cancelled; failing instead so it cannot read as a pass"
          exit 1

  integration-desktop:
    name: Integration / ${{ matrix.os }} ${{ matrix.shard }}/4
    needs: fortnight-gate
    if: needs.fortnight-gate.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    # Cost guardrail: no job may run unbounded. 90 minutes is per SHARD, and
    # the sweep is sharded four ways precisely because it does not fit
    # otherwise — see the `shard` axis below.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Four shards per OS. The unsharded sweep did not fit the 90-minute
        # guardrail and had not for a while: on 2026-09-03 macOS reached 30 of
        # 91 files and Windows 68 before the cap cut them, and the runs before
        # the cap existed took 2.5-3.6 hours. Nothing was hanging — macOS
        # `flutter clean`s and rebuilds the whole app per file, at ~3.3 min
        # each against Windows' ~1.2. The guardrail's old comment ("max
        # observed suite-wide is 29 min") was a figure from other jobs that
        # never applied to this one.
        #
        # Sharding does not reduce the premium minutes; it buys a run that
        # finishes and reports. Round-robin slicing (see the script) keeps the
        # slow FFI decoder files spread evenly rather than pooled in one shard.
        # `os` is a real axis, not an `include`-only key: two `include`
        # entries that both set `os` without naming a `shard` do not
        # reliably fan out to 8 jobs — the second can overwrite the first
        # rather than add. With `os` and `shard` as axes the 8 combinations
        # are explicit, and each `include` below only ATTACHES device/clean
        # to the combinations whose `os` it already matches.
        os: [macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
        include:
          # macOS keeps the script's default clean-between-files (the FFI
          # decoder suite hangs on a reused macOS build bundle); Windows reuses.
          - os: macos-latest
            device: macos
            clean: ''
          - os: windows-latest
            device: windows
            clean: '--no-clean'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wellen_ffi/target
          key: rust-integ-${{ matrix.os }}-${{ hashFiles('native/wellen_ffi/Cargo.lock') }}
          restore-keys: rust-integ-${{ matrix.os }}-

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.flutter.outputs.pub-cache-path }}
            .dart_tool/
          key: pub-integ-${{ matrix.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-integ-${{ matrix.os }}-

      # The restored `.dart_tool/` carries build_runner's asset graph, which a
      # `!` exclusion on the cache path cannot prevent. A graph written before
      # a source file was deleted — a crux-shared package's file after a pin
      # bump — fails codegen with `InvalidOutputException … Tried to delete
      # from package not in the build`, measured on the Pro overlay when
      # `lib/services/spawn/spawn_guards.dart` was removed here. Dropping the
      # graph is what actually keeps it out; a cold codegen costs ~13s.
      - name: Drop the restored build_runner asset graph
        shell: bash
        run: rm -rf .dart_tool/build

      - name: Install dependencies
        run: flutter pub get

      # integration_test/remote_control/wcp_add_signal_cli_subprocess_test.dart
      # spawns the real `wavecrux-ctl` CLI as a subprocess (`dart run`), which
      # needs its own resolved `.dart_tool/` — that nested package's
      # `.dart_tool/` is gitignored (see ci.yml's "Resolve tool/wavecrux_ctl
      # deps" step for the same requirement on the Analyze job).
      - name: Resolve tool/wavecrux_ctl deps
        run: dart pub get --directory tool/wavecrux_ctl

      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate l10n
        run: flutter gen-l10n

      # The macOS Runner / Windows CMake build the native lib via cargo and
      # bundle it next to the app, so no manual staging or library-path env is
      # needed — cargo just has to be on PATH (installed above). The runner
      # script invokes one `flutter test -d <device>` per file. bash is used on
      # Windows (Git Bash ships on the runner).
      - name: Run integration tests (-d ${{ matrix.device }}, shard ${{ matrix.shard }}/4)
        shell: bash
        run: tool/run_integration_tests.sh -d ${{ matrix.device }} ${{ matrix.clean }} --shard ${{ matrix.shard }}/4 ${{ github.event.inputs.subdirs }}
