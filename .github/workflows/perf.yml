name: Performance

# ─── Trigger configuration ─────────────────────────────────────────────────────
# Engine (large-file parse/query/RSS, VCD + FST) + render (1000–2000 lane paint)
# perf, plus a random-seed parser fuzz. Fixtures are generated by the Rust
# native/torture_gen (fast — multi-GB in seconds).
#
#   • baseline (Linux, weekly + manual): timed VCD + FST benches at matched
#     transition counts (directly compares the two parse paths) + a larger VCD,
#     the paint bench, and a random-seed fuzz parse (parse-without-crash, no
#     timing gate). Gates timed metrics vs tool/perf/baseline.json at a generous
#     1.5x multiplier. One OS so numbers are comparable.
#   • scale (Linux/macOS/Windows, manual): generates a MULTI-GB VCD + a large
#     FST and confirms each desktop OS opens them without crashing/OOM. macOS is
#     premium-billed, so it's opt-in (run before releases).
on:
  workflow_dispatch:
    inputs:
      scale_target_mb:
        description: 'Scale VCD target size in MB (Rust gen ~480ms/120MB; 2048≈2GB)'
        required: false
        default: '2048'
      scale_fst_transitions:
        description: 'Scale FST transition count (FST ~13x more compact; 100M≈heavy parse, ~100MB file)'
        required: false
        default: '100000000'
  schedule:
    - cron: '20 6 * * 3'   # weekly, Wednesday 05:00 UTC (= Tue 11 PM Mountain)

concurrency:
  # Keyed by event as well as ref: a nightly must never be cancelled by a
  # push, and a push must never be cancelled by a nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded pushes are cancelled outright. `false` on main was the source
  # of a whole class of phantom failures: a run still QUEUED when a third
  # push arrives is cancelled by GitHub regardless, and a run whose jobs were
  # cancelled reports conclusion=failure — not cancelled. So main never did
  # verify every commit, it just misreported the ones it skipped. Cancelling
  # is honest, cheaper, and gates the thing that matters: the tip.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    name: Perf baseline (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03

      - name: Cache Rust build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/wellen_ffi/target
            native/torture_gen/target
          key: rust-perf-${{ hashFiles('native/wellen_ffi/Cargo.lock', 'native/torture_gen/Cargo.lock') }}
          restore-keys: rust-perf-

      - name: Build native library (Rust FFI)
        working-directory: native/wellen_ffi
        run: cargo build --release

      - name: Build torture_gen
        run: cargo build --release --manifest-path native/torture_gen/Cargo.toml

      - name: Install Flutter (pinned)
        id: flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate l10n
        run: flutter gen-l10n

      # Matched 10M-transition VCD + FST (identical content, different parse
      # paths) + a bigger 40M VCD. Fixed --seed 42 → comparable numbers.
      - name: Generate perf fixtures (VCD + FST)
        run: |
          GEN=native/torture_gen/target/release/torture_gen
          "$GEN" --signals 2000 --transitions 10000000 --seed 42 --format vcd --out build/perf/fixtures/medium.vcd
          "$GEN" --signals 2000 --transitions 10000000 --seed 42 --format fst --out build/perf/fixtures/medium.fst
          "$GEN" --signals 2000 --transitions 40000000 --seed 42 --format vcd --out build/perf/fixtures/large.vcd
          ls -lh build/perf/fixtures/

      - name: Engine benchmark — VCD medium (10M, ~123 MB)
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/medium.vcd
          PERF_LABEL: vcd-medium
          PERF_APPEND: build/perf/results.jsonl

      - name: Engine benchmark — FST medium (10M, same content)
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/medium.fst
          PERF_LABEL: fst-medium
          PERF_APPEND: build/perf/results.jsonl

      - name: Engine benchmark — VCD large (40M, ~490 MB)
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/large.vcd
          PERF_LABEL: vcd-large
          PERF_APPEND: build/perf/results.jsonl

      - name: Render (paint) benchmark — 100/500/1000/2000 lanes
        run: flutter test --dart-define=RUN_BENCHMARKS=true test/benchmarks/waveform_paint_benchmark.dart
        env:
          PERF_PAINT_OUT: build/perf/paint_results.jsonl

      # Random-seed fuzz: a different structure each run. No timing gate — this
      # just asserts the parser opens an arbitrary capture without crashing.
      - name: Fuzz — random-seed parse (VCD + FST)
        run: |
          GEN=native/torture_gen/target/release/torture_gen
          "$GEN" --random --target-size-mb 60 --format vcd --out build/perf/fixtures/fuzz.vcd
          "$GEN" --random --target-size-mb 60 --format fst --out build/perf/fixtures/fuzz.fst
        env: {}
      - name: Fuzz — open random VCD
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/fuzz.vcd
          PERF_LABEL: fuzz-vcd
          PERF_APPEND: build/perf/results.jsonl
      - name: Fuzz — open random FST
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/fuzz.fst
          PERF_LABEL: fuzz-fst
          PERF_APPEND: build/perf/results.jsonl

      - name: Check against baseline (generous threshold)
        run: dart run tool/perf/check_baseline.dart

      - name: Upload perf metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-metrics
          path: |
            build/perf/results.jsonl
            build/perf/paint_results.jsonl
          if-no-files-found: warn

  scale:
    name: Scale — multi-GB VCD + large FST (${{ matrix.os }})
    # Manual only: generates a multi-GB VCD + large FST and confirms each desktop
    # OS opens them. Excluded from the weekly schedule to keep macOS (premium)
    # spend in check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03

      - name: Build native library (Rust FFI)
        working-directory: native/wellen_ffi
        run: cargo build --release

      - name: Build torture_gen
        run: cargo build --release --manifest-path native/torture_gen/Cargo.toml

      - name: Stage DLL (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item native\wellen_ffi\target\release\wellen_ffi.dll .

      - name: Install Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Riverpod codegen
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate l10n
        run: flutter gen-l10n

      - name: Generate multi-GB VCD + large FST
        shell: bash
        run: |
          GEN=native/torture_gen/target/release/torture_gen
          [ "${{ runner.os }}" = "Windows" ] && GEN=native/torture_gen/target/release/torture_gen.exe
          "$GEN" --signals 4000 --target-size-mb ${{ github.event.inputs.scale_target_mb || '2048' }} --seed 42 --format vcd --out build/perf/fixtures/huge.vcd
          "$GEN" --signals 4000 --transitions ${{ github.event.inputs.scale_fst_transitions || '100000000' }} --seed 42 --format fst --out build/perf/fixtures/huge.fst

      - name: Open multi-GB VCD (Linux/macOS)
        if: runner.os != 'Windows'
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/huge.vcd
          PERF_LABEL: scale-vcd-${{ matrix.os }}
          PERF_APPEND: build/perf/results.jsonl
      - name: Open large FST (Linux/macOS)
        if: runner.os != 'Windows'
        run: flutter test test/perf/engine_bench.dart
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/native/wellen_ffi/target/release
          PERF_FIXTURE: build/perf/fixtures/huge.fst
          PERF_LABEL: scale-fst-${{ matrix.os }}
          PERF_APPEND: build/perf/results.jsonl
      - name: Open multi-GB VCD (Windows)
        if: runner.os == 'Windows'
        run: flutter test test/perf/engine_bench.dart
        env:
          PERF_FIXTURE: build/perf/fixtures/huge.vcd
          PERF_LABEL: scale-vcd-windows
          PERF_APPEND: build/perf/results.jsonl
      - name: Open large FST (Windows)
        if: runner.os == 'Windows'
        run: flutter test test/perf/engine_bench.dart
        env:
          PERF_FIXTURE: build/perf/fixtures/huge.fst
          PERF_LABEL: scale-fst-windows
          PERF_APPEND: build/perf/results.jsonl

      - name: Upload scale metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-scale-${{ matrix.os }}
          path: build/perf/results.jsonl
          if-no-files-found: warn
