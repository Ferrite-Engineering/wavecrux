tags:
  integration:
    description: >
      Tests that require external resources (native wellen library, real VCD
      files on disk). Run with: flutter test --tags integration
  reference-live:
    description: >
      Tests that speak to a compiled server binary named by
      CRUX_MCP_SERVER_BIN (tool/build_cli.sh builds one). They declare no
      test when it is unset, which is every CI run.
